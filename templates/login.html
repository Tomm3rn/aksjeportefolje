{% extends 'base.html' %}
{% block title %}Logg inn{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-4 text-center fw-bold">
                    <i class="bi bi-graph-up-arrow text-success me-2"></i>Aksjeportefølje
                </h4>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Brukernavn</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Passord</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mt-2">Logg inn</button>
                </form>
                <hr>
                <p class="text-center mb-0 text-muted small">
                    Ny bruker? <a href="{{ url_for('register') }}">Opprett konto</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
